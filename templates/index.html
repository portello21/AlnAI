<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b141a">
    <title>Allan AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
<div class="app">
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-icon">💬</div>
                <div>
                    <h1>Allan AI</h1>
                    <span>Conversas ativas</span>
                </div>
            </div>
            <button id="closeSidebar" class="mobile-close">×</button>
        </div>
        <div class="agents-title">AGENTES</div>
        <nav id="agentList" class="agent-list">
            {% for id, agent in agents.items() %}
            <button class="agent-item {% if loop.first %}active{% endif %}" data-agent="{{ id }}">
                <div class="agent-avatar">{{ agent.icon }}</div>
                <div class="agent-info">
                    <div class="agent-name">{{ agent.name }}</div>
                    <div class="agent-description">{{ agent.description }}</div>
                </div>
            </button>
            {% endfor %}
        </nav>
        <div class="sidebar-footer">
            <span class="status-dot"></span> Allan AI online
        </div>
    </aside>

    <main class="chat">
        <header class="chat-header">
            <button id="openSidebar" class="mobile-menu">☰</button>
            <div id="currentAgentAvatar" class="chat-agent-avatar">🤖</div>
            <div class="chat-agent-details">
                <div id="currentAgentName">Orquestrador</div>
                <span id="currentAgentDescription">Coordena os agentes e decide tarefas.</span>
            </div>
            <div class="header-status">
                <button id="toggleTtsBtn" class="tts-toggle-btn active" title="Ativar/Desativar Resposta por Voz">🔊 Voz On</button>
                <span class="status-dot"></span>
            </div>
        </header>

        <section id="messages" class="messages"></section>

        <div id="typing" class="typing hidden">
            <span></span><span></span><span></span>
        </div>

        <form id="chatForm" class="composer">
            <div class="input-wrapper">
                <button id="micButton" type="button" class="mic-btn" title="Gravar Áudio">🎤</button>
                <textarea id="messageInput" rows="1" placeholder="Digite ou fale uma mensagem..."></textarea>
                <button id="sendButton" type="submit">➤</button>
            </div>
        </form>
    </main>
</div>
<div id="overlay" class="overlay"></div>

<script>window.ALLAN_AGENTS = {{ agents | tojson }};</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
