name: ROG AI V8 Quality

on:
  push:
    branches: [rog-v8-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest streamlit
      - name: Compile and run V8 contracts
        run: python scripts/validate_v8.py
