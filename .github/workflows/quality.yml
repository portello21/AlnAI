name: ROG AI Quality Gate

on:
  push:
    branches: [main, rog-v9-cloud-hotfix, "agent/**"]
  pull_request:
    branches: [main, rog-v9-cloud-hotfix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Reject tracked secrets and private data
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(\.env|secrets\.toml)$|(_private\.|\.pem$|\.key$)'; then
            echo "Sensitive file is tracked by git"
            exit 1
          fi
      - name: Compile application
        run: python -m compileall -q .
      - name: Run complete test suite
        env:
          ROG_CLOUD_MODE: "true"
        run: python -m pytest -q
      - name: Run release validators
        run: |
          python scripts/validate_v8.py
          python scripts/validate_v9.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -r requirements.txt
          python -m pip_audit --strict
